<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>闲言碎语 - 碎碎念记录</title>
    <style>
        /* 保持和Nightcrystalmaple网站类似的暗色/黑色沉浸式背景 */
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            max-width: 680px;
            margin: 0 auto;
            padding: 40px 20px;
            line-height: 1.6;
        }
        header {
            border-bottom: 1px solid #333;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        h1 {
            font-size: 1.8rem;
            color: #ffffff;
            margin: 0 0 10px 0;
        }
        p.subtitle {
            color: #888;
            font-size: 0.95rem;
            margin: 0;
        }
        .memo-box {
            background: #1e1e1e;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .memo-date {
            font-size: 0.85rem;
            color: #777;
            margin-bottom: 8px;
        }
        .memo-content {
            font-size: 1.05rem;
            color: #d4d4d4;
        }
        footer {
            text-align: center;
            margin-top: 50px;
            color: #555;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>闲言碎语</h1>
        <p class="subtitle">记录日常的灵感、情绪与碎碎念。</p>
    </header>

    <main>
        <!-- 第一条碎碎念示例，以后你可以直接在这里加新的 -->
        <div class="memo-box">
            <div class="memo-date">2026-09-29</div>
            <div class="memo-content">
                今天成功搭建了第二个独立网站仓库！黑色的背景看起来确实很有感觉，慢慢往里面加东西吧。
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Nightcrystalmaple</p>
    </footer>

</body>
</html>
